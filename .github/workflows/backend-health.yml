name: Zikra backend health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-health.yml'
      - 'backend/operations-health.mjs'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: zikra-backend-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24, verified 2026-10-26
        with:
          persist-credentials: false
          sparse-checkout: backend/operations-health.mjs
          sparse-checkout-cone-mode: false
      - name: Check HTTPS and Redis access denial without inference
        run: node backend/operations-health.mjs https://zikra-ai.vercel.app
