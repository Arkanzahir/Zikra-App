name: Zikra backend health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: zikra-backend-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-26
        with:
          persist-credentials: false
      - name: Check HTTPS and Redis access denial without inference
        run: node backend/operations-health.mjs https://zikra-ai.vercel.app
