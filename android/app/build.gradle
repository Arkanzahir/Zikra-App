plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zikra.app'
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.zikra.app'
        minSdk 26
        targetSdk 35
        versionCode 32
        versionName '1.9.5'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    if (project.findProperty('zikraHostedTests') == 'true') {
        sourceSets.androidTest.java.srcDir 'src/hostedTest/java'
    }
    if (project.findProperty('zikraPhoneTests') == 'true') {
        sourceSets.androidTest.java.srcDir 'src/phoneTest/java'
    }
}

dependencies {
    // OkHttp 3.x and Okio 1.x are Java, including their runtime dependencies.
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    // Native Java map; no Google key or billing is required for the OSM provider.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
