plugins {
    id 'com.android.application'
}

def releaseAdultAccounts = providers.gradleProperty('zikraReleaseAdultAccounts')
    .orElse('false').map { it == 'true' }

def internalAdhan = providers.gradleProperty('zikraInternalAdhan').orElse('false').get() == 'true'

android {
    namespace 'com.zikra.app'
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.zikra.app'
        minSdk 26
        targetSdk 36
        versionCode 91
        versionName '1.9.64'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'INTERNAL_ADHAN', internalAdhan.toString()
            buildConfigField 'boolean', 'PUBLIC_BETA_SCOPE', providers.gradleProperty('zikraPublicBetaScope').orElse('false').get().toBoolean().toString()
            buildConfigField 'boolean', 'ADULT_ACCOUNTS_ENABLED', providers.gradleProperty('zikraAdultAccounts').orElse('false').get().toBoolean().toString()
            buildConfigField 'boolean', 'ACCOUNT_SIGN_IN_ENABLED', providers.gradleProperty('zikraAccountSignIn').orElse('false').get().toBoolean().toString()
            buildConfigField 'boolean', 'ACCOUNT_DELETION_ENABLED', providers.gradleProperty('zikraAccountEmulator').orElse('false').get().toBoolean().toString()
            buildConfigField 'boolean', 'ACCOUNT_AUTH_EMULATOR', providers.gradleProperty('zikraAccountEmulator').orElse('false').get().toBoolean().toString()
        }
        release {
            if (internalAdhan) versionNameSuffix '-internal'
            buildConfigField 'boolean', 'INTERNAL_ADHAN', internalAdhan.toString()
            buildConfigField 'boolean', 'PUBLIC_BETA_SCOPE', 'true'
            buildConfigField 'boolean', 'ADULT_ACCOUNTS_ENABLED', releaseAdultAccounts.get().toString()
            buildConfigField 'boolean', 'ACCOUNT_SIGN_IN_ENABLED', releaseAdultAccounts.get().toString()
            buildConfigField 'boolean', 'ACCOUNT_DELETION_ENABLED', (releaseAdultAccounts.get() && project.findProperty('zikraReleaseAccountDeletion') == 'true').toString()
            buildConfigField 'boolean', 'ACCOUNT_AUTH_EMULATOR', 'false'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    if (project.findProperty('zikraHostedTests') == 'true') {
        sourceSets.androidTest.java.srcDir 'src/hostedTest/java'
    }
    if (project.findProperty('zikraPhoneTests') == 'true') {
        sourceSets.androidTest.java.srcDir 'src/phoneTest/java'
    }
    androidResources.noCompress += ['mp3']
}

// Original recordings are optional local inputs. Only an explicit internal build
// can include them in a release APK.
def adhanSource = providers.gradleProperty('zikraAdhanAudio')
def fajrSource = providers.gradleProperty('zikraFajrAudio')
def registerAdhanAssets = { String buildType, boolean include, boolean requirePair ->
    def suffix = buildType.capitalize()
    def destination = layout.buildDirectory.dir('generated/adhanAssets' + suffix)
    def task = tasks.register('prepare' + suffix + 'AdhanAudio') {
        def sources = [selected: adhanSource, fajr: fajrSource]
        inputs.property('include', include)
        inputs.property('requirePair', requirePair)
        sources.each { name, provider ->
            inputs.property(name, include ? provider.orElse('') : '')
            if (include && provider.isPresent()) inputs.file(file(provider.get()))
        }
        outputs.dir(destination)
        doLast {
            if (requirePair && sources.values().any { !it.isPresent() }) {
                throw new GradleException('Internal adhan requires both zikraAdhanAudio and zikraFajrAudio')
            }
            def root = layout.buildDirectory.get().asFile.canonicalFile.toPath()
            def target = destination.get().asFile.canonicalFile
            if (!target.toPath().startsWith(root)) throw new GradleException('Invalid generated audio path')
            delete(target)
            if (include) {
                sources.each { name, provider ->
                    if (provider.isPresent()) {
                        def source = file(provider.get())
                        if (!source.isFile() || source.length() == 0 || source.length() > 10000000) {
                            throw new GradleException('Expected a local audio file below 10 MB')
                        }
                        copy { from source; into new File(target, 'adhan'); rename { name + '.mp3' } }
                    }
                }
            }
        }
    }
    android.sourceSets.getByName(buildType).assets.srcDir(task)
    tasks.matching { it.name == 'pre' + suffix + 'Build' }.configureEach { dependsOn(task) }
}
registerAdhanAssets('debug', true, internalAdhan)
registerAdhanAssets('release', internalAdhan, internalAdhan)

dependencies {
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    // Keep Auth on the compatible pre-25 line while AGP's lint uses Kotlin metadata2.1.
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    // OkHttp 3.x and Okio 1.x are Java, including their runtime dependencies.
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    // Native Java map; no Google key or billing is required for the OSM provider.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Client identifiers are generated locally. Service-account credentials are never accepted here.
def firebaseClient = providers.gradleProperty('zikraFirebaseConfig')
    .orElse(rootProject.file('../.local/firebase-android.json').absolutePath)
def prepareFirebaseClient = tasks.register('prepareFirebaseClient') {
    inputs.property('path', firebaseClient)
    def input = file(firebaseClient.get())
    if (input.exists()) inputs.file(input)
    outputs.dir(layout.buildDirectory.dir('generated/firebaseClient'))
    doLast {
        def values = [:]
        if (input.exists()) {
            if (input.length() > 65536) throw new GradleException('Invalid Firebase client configuration')
            def parsed = new groovy.json.JsonSlurper().parse(input)
            if (parsed.private_key || parsed.type == 'service_account') throw new GradleException('Server credentials must never be bundled')
            def client = parsed.client?.find { it.client_info?.android_client_info?.package_name == 'com.zikra.app' }
            values = [google_app_id: client?.client_info?.mobilesdk_app_id,
                google_api_key: client?.api_key?.getAt(0)?.current_key,
                gcm_defaultSenderId: parsed.project_info?.project_number,
                project_id: parsed.project_info?.project_id]
            if (!(values.google_app_id ==~ /1:[0-9]+:android:[a-f0-9]{16,64}/)
                || !(values.google_api_key ==~ /AIza[A-Za-z0-9_-]{30,50}/)
                || !(values.gcm_defaultSenderId ==~ /[0-9]{6,20}/)
                || !(values.project_id ==~ /[a-z][a-z0-9-]{4,61}[a-z0-9]/))
                throw new GradleException('Invalid Firebase Android app configuration')
        }
        def destination = layout.buildDirectory.file('generated/firebaseClient/values/quake_firebase.xml').get().asFile
        destination.parentFile.mkdirs()
        def writer = new StringWriter()
        new groovy.xml.MarkupBuilder(writer).resources {
            bool(name: 'quake_push_configured', !values.isEmpty())
            values.each { key, value -> string(name: key, translatable: 'false', value) }
        }
        destination.setText(writer.toString(), 'UTF-8')
    }
}
android.sourceSets.main.res.srcDir(prepareFirebaseClient)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn(prepareFirebaseClient) }

if (releaseAdultAccounts.get()) {
    def validateReleaseAccountClient = tasks.register('validateReleaseAccountClient') {
        dependsOn(prepareFirebaseClient)
        doLast {
            def input = file(firebaseClient.get())
            if (!input.isFile() || new groovy.json.JsonSlurper().parse(input).project_info?.project_id != 'zikra-79b75') {
                throw new GradleException('Release accounts require the Zikra production Firebase client configuration')
            }
        }
    }
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn(validateReleaseAccountClient) }
}

apply from: rootProject.file('release-signing.gradle')
