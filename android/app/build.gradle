plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zikra.app'
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.zikra.app'
        minSdk 26
        targetSdk 35
        versionCode 53
        versionName '1.9.26'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    if (project.findProperty('zikraHostedTests') == 'true') {
        sourceSets.androidTest.java.srcDir 'src/hostedTest/java'
    }
    if (project.findProperty('zikraPhoneTests') == 'true') {
        sourceSets.androidTest.java.srcDir 'src/phoneTest/java'
    }
    androidResources.noCompress += ['mp3']
}

// Private beta audio is supplied explicitly; it is not copied into source control or release builds.
def adhanSource = providers.gradleProperty('zikraAdhanAudio')
def fajrSource = providers.gradleProperty('zikraFajrAudio')
def prepareAdhanAudio = tasks.register('prepareDebugAdhanAudio') {
    inputs.property('source', adhanSource.orElse(''))
    inputs.property('fajrSource', fajrSource.orElse(''))
    if (adhanSource.isPresent()) inputs.file(file(adhanSource.get()))
    if (fajrSource.isPresent()) inputs.file(file(fajrSource.get()))
    outputs.dir(layout.buildDirectory.dir('generated/adhanAssets'))
    doLast {
        def root = layout.buildDirectory.get().asFile.canonicalFile.toPath()
        def destination = layout.buildDirectory.dir('generated/adhanAssets').get().asFile.canonicalFile
        if (!destination.toPath().startsWith(root)) throw new GradleException('Invalid generated audio path')
        delete(destination)
        [selected: adhanSource, fajr: fajrSource].each { name, provider ->
            if (provider.isPresent()) {
                def source = file(provider.get())
                if (!source.isFile() || source.length() == 0 || source.length() > 10000000)
                    throw new GradleException('Expected a local audio file below 10 MB')
                copy { from source; into new File(destination, 'adhan'); rename { name + '.mp3' } }
            }
        }
    }
}
android.sourceSets.debug.assets.srcDir(prepareAdhanAudio)
// AGP must generate the selected private audio before it decides whether assets changed.
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn(prepareAdhanAudio) }

dependencies {
    // OkHttp 3.x and Okio 1.x are Java, including their runtime dependencies.
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    // Native Java map; no Google key or billing is required for the OSM provider.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
