<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usulan simbol Zikra</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f7f1;color:#173c36;font-family:Arial,sans-serif}
    main{width:100%;max-width:760px;margin:auto;padding:32px 24px 28px}header{margin-bottom:30px}
    .eyebrow{color:#6e7f70;font-size:11px;letter-spacing:1.8px;font-weight:700;text-transform:uppercase}
    h1{font-size:25px;font-weight:600;letter-spacing:-.6px;margin:10px 0 0}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 12px}
    figure{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;margin:0;min-width:0}
    img{width:64px;height:64px;display:block}figcaption{font-size:14px;line-height:1.3;font-weight:500;white-space:nowrap}
    footer{border-top:1px solid #dfe5d9;margin-top:28px;padding-top:16px;font-size:11px;color:#667a6e}
    body[data-size="home"] main{max-width:390px;padding:22px 12px}body[data-size="home"] header,body[data-size="home"] footer{display:none}
    body[data-size="home"] .grid{gap:22px 6px}body[data-size="home"] img{width:34px;height:34px}body[data-size="home"] figcaption{font-size:12px}
    @media(max-width:420px){main{padding:24px 12px}.grid{gap:26px 6px}h1{font-size:22px}img{width:48px;height:48px}figcaption{font-size:12px}}
  </style>
</head>
<body>
  <main>
    <header><div class="eyebrow">Zikra · Usulan simbol baru</div><h1>Simbol berbeda. Satu karakter.</h1></header>
    <div class="grid" aria-label="Delapan usulan simbol fitur Zikra">
      <figure><img src="quran.svg" alt="Quran terbuka di atas rehal"><figcaption>Quran</figcaption></figure>
      <figure><img src="doa.svg" alt="Dua tangan menengadah dengan bulan sabit"><figcaption>Doa</figcaption></figure>
      <figure><img src="kiblat.svg" alt="Kaabah dan penunjuk arah"><figcaption>Kiblat</figcaption></figure>
      <figure><img src="hifz.svg" alt="Mushaf bertanda hafalan"><figcaption>Hifz</figcaption></figure>
      <figure><img src="ai.svg" alt="Percakapan dengan sabit dan kilau"><figcaption>Zikra AI</figcaption></figure>
      <figure><img src="protector.svg" alt="Perisai dengan cuaca"><figcaption>Protector</figcaption></figure>
      <figure><img src="study.svg" alt="Buku belajar dan pensil"><figcaption>Study</figcaption></figure>
      <figure><img src="hadis.svg" alt="Gulungan riwayat"><figcaption>Hadis</figcaption></figure>
    </div>
    <footer>Preview desain · belum diterapkan pada aplikasi</footer>
  </main>
</body>
</html>
